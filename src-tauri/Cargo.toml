[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.4", features = ["custom-protocol"] }
tauri-runtime-wry = { version = "3.0.0-alpha.4" }
tauri-plugin-log = "3.0.0-alpha.1"
ureq = { version = "2.10", features = ["tls"] }
sha2 = "0.10"
hex = "0.4"
